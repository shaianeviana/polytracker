<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polymarket Tracker — Seu Dashboard Personalizado</title>
<meta name="description" content="Cole sua wallet e veja seu desempenho completo na Polymarket: acertos, erros, lucros, perdas e mais.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230052FF'/><text x='16' y='23' text-anchor='middle' fill='white' font-size='20' font-weight='bold'>P</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f9fc;
  --bg-card: #ffffff;
  --bg-hover: #f0f4fa;
  --border: #e2e8f0;
  --border-light: #eef2f7;
  --text: #1a1f36;
  --text-secondary: #697386;
  --text-dim: #8892a4;
  --blue: #0052FF;
  --blue-light: #e8f0ff;
  --blue-dark: #003bb3;
  --blue-glow: rgba(0,82,255,0.15);
  --green: #00b341;
  --green-bg: #e6f9ed;
  --red: #e5484d;
  --red-bg: #fef0f0;
  --yellow: #f5a623;
  --yellow-bg: #fef7e8;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 30px rgba(0,0,0,0.08);
  --radius: 12px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter',-apple-system,system-ui,sans-serif; background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; }
a { color:var(--blue); text-decoration:none; }

/* ── HEADER ── */
.header { background:#fff; border-bottom:1px solid var(--border); padding:14px 24px; position:sticky; top:0; z-index:100; }
.header-inner { max-width:1400px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; }
.logo { display:flex; align-items:center; gap:10px; font-weight:800; font-size:18px; color:var(--text); cursor:pointer; }
.logo-icon { width:30px; height:30px; background:var(--blue); border-radius:7px; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:16px; }
.header-right { display:flex; align-items:center; gap:12px; }
.wallet-pill { font-family:'JetBrains Mono',monospace; font-size:12px; background:var(--bg); padding:6px 14px; border-radius:8px; border:1px solid var(--border); color:var(--text-secondary); }
.status-dot { width:7px; height:7px; border-radius:50%; background:var(--green); display:inline-block; margin-right:3px; animation:pulse 2s infinite; }
.btn { padding:7px 16px; border-radius:8px; font-weight:600; font-size:13px; cursor:pointer; border:none; transition:all 0.15s; }
.btn-primary { background:var(--blue); color:#fff; }
.btn-primary:hover { background:var(--blue-dark); }
.btn-outline { background:transparent; color:var(--text-secondary); border:1px solid var(--border); }
.btn-outline:hover { border-color:var(--blue); color:var(--blue); }

/* ── LANDING ── */
.landing { min-height:100vh; display:flex; flex-direction:column; }
.hero {
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:60px 24px; text-align:center; position:relative; overflow:hidden;
}
.hero::before {
  content:''; position:absolute; top:-200px; left:50%; transform:translateX(-50%);
  width:800px; height:800px; border-radius:50%;
  background:radial-gradient(circle, var(--blue-glow) 0%, transparent 70%);
  pointer-events:none;
}
.hero-badge {
  display:inline-flex; align-items:center; gap:6px;
  background:var(--blue-light); color:var(--blue); padding:6px 14px;
  border-radius:20px; font-size:12px; font-weight:600; margin-bottom:24px;
  position:relative;
}
.hero h1 { font-size:clamp(36px,6vw,64px); font-weight:900; line-height:1.05; margin-bottom:16px; position:relative; letter-spacing:-1.5px; }
.hero h1 span { color:var(--blue); }
.hero p { font-size:18px; color:var(--text-secondary); max-width:520px; line-height:1.6; margin-bottom:40px; position:relative; }

.wallet-form {
  display:flex; gap:8px; width:100%; max-width:580px; position:relative;
}
.wallet-input {
  flex:1; padding:16px 20px; border-radius:14px; border:2px solid var(--border);
  font-size:15px; font-family:'JetBrains Mono',monospace; color:var(--text);
  background:#fff; outline:none; transition:border-color 0.2s, box-shadow 0.2s;
  box-shadow:var(--shadow);
}
.wallet-input:focus { border-color:var(--blue); box-shadow:0 0 0 4px var(--blue-glow); }
.wallet-input::placeholder { color:var(--text-dim); font-family:'Inter',sans-serif; }
.wallet-submit {
  padding:16px 28px; border-radius:14px; background:var(--blue); color:#fff;
  font-size:15px; font-weight:700; border:none; cursor:pointer;
  transition:background 0.15s, transform 0.1s; white-space:nowrap;
  box-shadow:0 2px 8px rgba(0,82,255,0.3);
}
.wallet-submit:hover { background:var(--blue-dark); transform:translateY(-1px); }
.wallet-submit:active { transform:translateY(0); }
.wallet-error { color:var(--red); font-size:13px; margin-top:10px; font-weight:500; }

.features {
  display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:16px; max-width:750px; width:100%; margin-top:50px; position:relative;
}
.feature-card {
  background:#fff; border:1px solid var(--border); border-radius:var(--radius);
  padding:20px; text-align:left; box-shadow:var(--shadow-sm);
}
.feature-icon { font-size:24px; margin-bottom:10px; }
.feature-title { font-weight:700; font-size:14px; margin-bottom:4px; }
.feature-desc { font-size:13px; color:var(--text-secondary); line-height:1.5; }

/* ── DASHBOARD ── */
.container { max-width:1400px; margin:0 auto; padding:24px 24px 60px; }
.stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(195px,1fr)); gap:12px; margin-bottom:24px; }
.stat-card {
  background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius);
  padding:18px 20px; box-shadow:var(--shadow-sm); transition:box-shadow 0.2s,transform 0.2s;
  animation:fadeIn 0.4s ease both;
}
.stat-card:hover { box-shadow:var(--shadow-md); transform:translateY(-1px); }
.stat-label { font-size:11px; font-weight:600; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.8px; margin-bottom:6px; }
.stat-value { font-family:'JetBrains Mono',monospace; font-size:26px; font-weight:700; line-height:1.1; }
.stat-sub { font-size:12px; color:var(--text-secondary); margin-top:5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.stat-value.positive { color:var(--green); }
.stat-value.negative { color:var(--red); }
.stat-value.blue { color:var(--blue); }

.section { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-sm); margin-bottom:20px; overflow:hidden; }
.section-header { padding:16px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; }
.section-title { font-size:15px; font-weight:700; display:flex; align-items:center; gap:8px; }

.cat-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:1px; background:var(--border); }
.cat-card { background:var(--bg-card); padding:18px 20px; transition:background 0.15s; }
.cat-card:hover { background:var(--bg-hover); }
.cat-name { font-weight:700; font-size:14px; margin-bottom:10px; display:flex; align-items:center; gap:7px; }
.cat-row { display:flex; gap:16px; flex-wrap:wrap; }
.cat-metric { font-size:11px; color:var(--text-secondary); }
.cat-metric-val { font-family:'JetBrains Mono',monospace; font-size:15px; font-weight:700; color:var(--text); display:block; margin-top:1px; }
.progress-bar { height:4px; background:var(--border-light); border-radius:2px; overflow:hidden; margin-top:8px; }
.progress-fill { height:100%; border-radius:2px; transition:width 0.8s ease; }
.progress-fill.green { background:var(--green); }
.progress-fill.red { background:var(--red); }

.controls { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.tabs { display:flex; gap:2px; background:var(--bg); border-radius:10px; padding:3px; border:1px solid var(--border); }
.tab { padding:7px 14px; border-radius:8px; cursor:pointer; font-size:12px; font-weight:600; color:var(--text-secondary); background:none; border:none; transition:all 0.15s; white-space:nowrap; }
.tab:hover { color:var(--text); }
.tab.active { background:var(--blue); color:#fff; }
.search-input { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:7px 12px; font-size:13px; color:var(--text); width:220px; font-family:inherit; outline:none; transition:border-color 0.15s; }
.search-input:focus { border-color:var(--blue); }
.search-input::placeholder { color:var(--text-dim); }

.table-scroll { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th { text-align:left; padding:11px 16px; font-size:10px; text-transform:uppercase; letter-spacing:0.8px; color:var(--text-dim); border-bottom:1px solid var(--border); font-weight:600; cursor:pointer; user-select:none; white-space:nowrap; background:var(--bg); position:sticky; top:0; }
th:hover { color:var(--text); }
th.sorted { color:var(--blue); }
td { padding:10px 16px; border-bottom:1px solid var(--border-light); vertical-align:middle; }
tr:last-child td { border-bottom:none; }
tr:hover td { background:var(--bg-hover); }
.market-name { max-width:320px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500; }
.badge { display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600; }
.badge.win { background:var(--green-bg); color:var(--green); }
.badge.loss { background:var(--red-bg); color:var(--red); }
.badge.open { background:var(--yellow-bg); color:var(--yellow); }
.mono { font-family:'JetBrains Mono',monospace; font-weight:500; }
.pnl-pos { color:var(--green); }
.pnl-neg { color:var(--red); }

.pagination { display:flex; gap:4px; justify-content:center; padding:14px; border-top:1px solid var(--border); }
.page-btn { padding:6px 12px; border-radius:6px; border:1px solid var(--border); background:#fff; color:var(--text-secondary); cursor:pointer; font-size:12px; font-weight:500; transition:all 0.15s; }
.page-btn:hover { border-color:var(--blue); color:var(--blue); }
.page-btn.active { background:var(--blue); color:#fff; border-color:var(--blue); }

.loading-screen { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:80px 20px; gap:14px; }
.spinner { width:36px; height:36px; border:3px solid var(--border); border-top-color:var(--blue); border-radius:50%; animation:spin 0.8s linear infinite; }
.loading-text { font-size:14px; color:var(--text-secondary); }
.error-box { background:var(--red-bg); border:1px solid #fcc; border-radius:var(--radius); padding:24px; margin:40px auto; max-width:500px; text-align:center; color:var(--red); }
.footer-note { text-align:center; padding:20px; color:var(--text-dim); font-size:11px; }

.share-link { font-family:'JetBrains Mono',monospace; font-size:11px; background:var(--bg); padding:5px 10px; border-radius:6px; border:1px solid var(--border); color:var(--text-secondary); cursor:pointer; transition:all 0.15s; }
.share-link:hover { border-color:var(--blue); }

@keyframes spin { to { transform:rotate(360deg); } }
@keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }

@media (max-width:768px) {
  .container { padding:16px; }
  .header { padding:12px 16px; }
  .stat-value { font-size:20px; }
  .stats-grid { grid-template-columns:repeat(2,1fr); gap:8px; }
  .search-input { width:100%; }
  .section-header { flex-direction:column; align-items:stretch; }
  .wallet-form { flex-direction:column; }
  .wallet-submit { width:100%; }
  .wallet-pill { display:none; }
  .hero h1 { letter-spacing:-1px; }
  .features { grid-template-columns:1fr; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="logo" onclick="goHome()"><div class="logo-icon">P</div> Polymarket Tracker</div>
    <div class="header-right" id="headerRight"></div>
  </div>
</div>

<div id="app"></div>

<script>
// ─── STATE ───
const PER_PAGE = 30;
let allResults = [];
let currentFilter = "all";
let currentSearch = "";
let sortKey = "pnl";
let sortDir = -1;
let currentPage = 1;
let currentWallet = null;

// ─── ROUTING ───
function getWalletFromURL() {
  const params = new URLSearchParams(window.location.search);
  return params.get("wallet") || params.get("w") || null;
}

function setWalletURL(wallet) {
  const url = new URL(window.location);
  url.searchParams.set("wallet", wallet);
  window.history.pushState({}, "", url);
}

function goHome() {
  window.history.pushState({}, "", window.location.pathname);
  currentWallet = null;
  allResults = [];
  renderLanding();
  updateHeader();
}

window.addEventListener("popstate", () => {
  const w = getWalletFromURL();
  if (w && /^0x[a-fA-F0-9]{40}$/.test(w)) { loadWallet(w); }
  else { goHome(); }
});

// ─── API ───
function apiUrl(wallet, type = "activity", offset = 0, limit = 500) {
  const isVercel = window.location.hostname !== "localhost" && window.location.hostname !== "127.0.0.1";
  if (isVercel) return `/api/data?wallet=${wallet}&type=${type}&offset=${offset}&limit=${limit}`;
  return `https://data-api.polymarket.com/${type === "activity" ? "activity" : type === "profile" ? "profile" : "positions"}?user=${wallet}&limit=${limit}&offset=${offset}${type === "positions" ? "&sizeThreshold=0" : ""}`;
}

async function fetchAllActivity(wallet) {
  let all = [];
  let offset = 0;
  const limit = 500;
  while (true) {
    const res = await fetch(apiUrl(wallet, "activity", offset, limit));
    if (!res.ok) throw new Error(`API retornou ${res.status}`);
    const batch = await res.json();
    if (!batch || !Array.isArray(batch) || batch.length === 0) break;
    all = all.concat(batch);
    if (batch.length < limit) break;
    offset += limit;
  }
  return all;
}

// ─── PROCESS ───
function processActivity(activities) {
  const markets = {};
  for (const a of activities) {
    const key = a.conditionId || a.title;
    if (!key) continue;
    if (!markets[key]) markets[key] = { title: a.title || key, slug: a.slug || "", icon: a.icon || "", buys: [], sells: [], redeems: [] };
    const entry = { usdc: parseFloat(a.usdcSize) || 0, tokens: parseFloat(a.size) || 0, side: a.side, outcome: a.outcome || "", price: parseFloat(a.price) || 0 };
    const type = (a.type || "").toUpperCase();
    if (type === "TRADE" && a.side === "BUY") markets[key].buys.push(entry);
    else if (type === "TRADE" && a.side === "SELL") markets[key].sells.push(entry);
    else if (["REDEEM","SPLIT","MERGE"].includes(type)) markets[key].redeems.push(entry);
  }
  const results = [];
  for (const [id, m] of Object.entries(markets)) {
    if (m.buys.length === 0) continue;
    const totalBought = m.buys.reduce((s,b) => s + b.usdc, 0);
    const totalSold = m.sells.reduce((s,b) => s + b.usdc, 0);
    const totalRedeemed = m.redeems.reduce((s,b) => s + b.usdc, 0);
    const sides = [...new Set(m.buys.map(b => b.outcome))].filter(Boolean);
    const hasRedeems = m.redeems.length > 0;
    const pnl = (totalSold + totalRedeemed) - totalBought;
    let outcome;
    if (!hasRedeems && totalSold < totalBought) outcome = "ABERTO";
    else if (totalRedeemed > 0) outcome = "ACERTO";
    else if (hasRedeems && totalRedeemed === 0) outcome = "ERRO";
    else outcome = "ABERTO";
    results.push({ market: m.title, slug: m.slug, icon: m.icon, side: sides.join(", ") || "-", invested: Math.round(totalBought*100)/100, sold: Math.round(totalSold*100)/100, redeemed: Math.round(totalRedeemed*100)/100, pnl: Math.round(pnl*100)/100, outcome });
  }
  return results;
}

function categorize(name) {
  const n = name.toLowerCase();
  if (/vs\./.test(name) && !/open|championship|qualification|:/i.test(name) && !/^will /i.test(name)) return { cat:"NBA", emoji:"🏀" };
  if (/open|championship|qualification|atp|wta/i.test(name) || (/:/.test(name) && /vs/i.test(name) && !/^will /i.test(name) && !/bitcoin|temperature|chelsea|brazil|iran/i.test(name))) return { cat:"Tênis", emoji:"🎾" };
  if (/academy award|oscar|golden globe/i.test(name)) return { cat:"Premiações", emoji:"🏆" };
  if (/will .*(fc |cf |united |win on)/i.test(name) || /chelsea|napoli|bournemouth|brentford|villarreal|kilmarnock|valladolid|torino/i.test(name)) return { cat:"Futebol", emoji:"⚽" };
  if (/temperature|°[FC]/i.test(name)) return { cat:"Clima", emoji:"🌡️" };
  if (/bitcoin/i.test(name)) return { cat:"Bitcoin", emoji:"₿" };
  if (/iran|forces|strikes/i.test(name)) return { cat:"Geopolítica", emoji:"🌍" };
  if (/brazil|lula|bbb|big brother/i.test(name)) return { cat:"Brasil", emoji:"🇧🇷" };
  if (/nfl|nhl|mlb|nascar|f1\b|formula/i.test(name)) return { cat:"Esportes", emoji:"🏈" };
  if (/trump|biden|election|congress|senate|president/i.test(name)) return { cat:"Política", emoji:"🗳️" };
  if (/crypto|eth |solana|doge/i.test(name)) return { cat:"Crypto", emoji:"🪙" };
  return { cat:"Outros", emoji:"📊" };
}

// ─── HEADER ───
function updateHeader() {
  const el = document.getElementById("headerRight");
  if (!currentWallet) {
    el.innerHTML = "";
    return;
  }
  const short = currentWallet.slice(0,6) + "…" + currentWallet.slice(-4);
  const shareUrl = window.location.href;
  el.innerHTML = `
    <span style="font-size:13px;color:var(--text-secondary)"><span class="status-dot"></span> Live</span>
    <span class="wallet-pill">${short}</span>
    <button class="btn btn-outline" onclick="navigator.clipboard.writeText('${shareUrl}');this.textContent='Copiado!';setTimeout(()=>this.textContent='Compartilhar',1500)">Compartilhar</button>
    <button class="btn btn-outline" onclick="goHome()">Trocar Wallet</button>
    <button class="btn btn-primary" onclick="loadWallet('${currentWallet}')">↻</button>
  `;
}

// ─── LANDING PAGE ───
function renderLanding() {
  document.getElementById("app").innerHTML = `
    <div class="landing">
      <div class="hero">
        <div class="hero-badge">📊 100% gratuito · Open Source</div>
        <h1>Seu dashboard<br><span>Polymarket</span></h1>
        <p>Cole o endereço da sua carteira e veja instantaneamente seu desempenho completo: acertos, erros, lucros, categorias e mais.</p>
        <div class="wallet-form" id="walletForm">
          <input type="text" class="wallet-input" id="walletInput" placeholder="0x... cole seu endereço aqui" spellcheck="false" autocomplete="off">
          <button class="wallet-submit" onclick="submitWallet()">Analisar →</button>
        </div>
        <div class="wallet-error" id="walletError"></div>
        <div class="features">
          <div class="feature-card">
            <div class="feature-icon">⚡</div>
            <div class="feature-title">Tempo real</div>
            <div class="feature-desc">Dados puxados direto da API pública da Polymarket, atualizados a cada 5 minutos.</div>
          </div>
          <div class="feature-card">
            <div class="feature-icon">🔗</div>
            <div class="feature-title">Compartilhável</div>
            <div class="feature-desc">Cada dashboard gera um link único que você pode compartilhar com qualquer pessoa.</div>
          </div>
          <div class="feature-card">
            <div class="feature-icon">🔒</div>
            <div class="feature-title">Sem login</div>
            <div class="feature-desc">Não precisa conectar carteira nem fazer login. Só colar o endereço e pronto.</div>
          </div>
        </div>
      </div>
    </div>
  `;
  document.getElementById("walletInput")?.addEventListener("keydown", e => { if (e.key === "Enter") submitWallet(); });
  // Focus input
  setTimeout(() => document.getElementById("walletInput")?.focus(), 100);
}

function submitWallet() {
  const input = document.getElementById("walletInput");
  const error = document.getElementById("walletError");
  const val = (input?.value || "").trim();
  if (!/^0x[a-fA-F0-9]{40}$/.test(val)) {
    error.textContent = "Endereço inválido. Deve começar com 0x seguido de 40 caracteres hexadecimais.";
    input?.classList.add("error");
    return;
  }
  error.textContent = "";
  setWalletURL(val);
  loadWallet(val);
}

// ─── LOAD WALLET ───
async function loadWallet(wallet) {
  currentWallet = wallet;
  currentFilter = "all";
  currentSearch = "";
  sortKey = "pnl";
  sortDir = -1;
  currentPage = 1;
  updateHeader();

  document.getElementById("app").innerHTML = `
    <div class="container">
      <div class="loading-screen">
        <div class="spinner"></div>
        <div class="loading-text">Carregando dados de ${wallet.slice(0,6)}…${wallet.slice(-4)}</div>
      </div>
    </div>
  `;

  try {
    const activities = await fetchAllActivity(wallet);
    if (!activities || activities.length === 0) {
      document.getElementById("app").innerHTML = `<div class="container"><div class="error-box">Nenhuma atividade encontrada para essa carteira.<br><br><small style="color:var(--text-secondary)">Verifique se o endereço está correto ou se a carteira tem histórico na Polymarket.</small><br><br><button class="btn btn-primary" onclick="goHome()">Tentar outra wallet</button></div></div>`;
      return;
    }
    allResults = processActivity(activities);
    renderDashboard();
  } catch (err) {
    document.getElementById("app").innerHTML = `<div class="container"><div class="error-box">Erro ao carregar dados: ${err.message}<br><br><button class="btn btn-primary" onclick="loadWallet('${wallet}')">Tentar novamente</button> <button class="btn btn-outline" onclick="goHome()" style="margin-left:8px">Voltar</button></div></div>`;
  }
}

// ─── DASHBOARD ───
function renderDashboard() {
  const app = document.getElementById("app");
  const acertos = allResults.filter(d => d.outcome === "ACERTO");
  const erros = allResults.filter(d => d.outcome === "ERRO");
  const abertos = allResults.filter(d => d.outcome === "ABERTO");
  const resolved = acertos.length + erros.length;
  const winRate = resolved > 0 ? (acertos.length / resolved * 100) : 0;
  const totalInvested = allResults.reduce((s,d) => s + d.invested, 0);
  const totalPnl = allResults.reduce((s,d) => s + d.pnl, 0);
  const best = allResults.length > 0 ? allResults.reduce((b,d) => d.pnl > b.pnl ? d : b, allResults[0]) : null;
  const worst = allResults.length > 0 ? allResults.reduce((w,d) => d.pnl < w.pnl ? d : w, allResults[0]) : null;

  const catMap = {};
  allResults.forEach(d => {
    const { cat, emoji } = categorize(d.market);
    if (!catMap[cat]) catMap[cat] = { emoji, wins:0, losses:0, pnl:0, invested:0, count:0 };
    catMap[cat].count++; catMap[cat].invested += d.invested; catMap[cat].pnl += d.pnl;
    if (d.outcome === "ACERTO") catMap[cat].wins++;
    if (d.outcome === "ERRO") catMap[cat].losses++;
  });

  app.innerHTML = `<div class="container">
    <div class="stats-grid">
      ${sc("Total Apostas", allResults.length, `${acertos.length} ✓  ${erros.length} ✗  ${abertos.length} ◷`, "blue", 0)}
      ${sc("Taxa de Acerto", winRate.toFixed(1)+"%", `${acertos.length} de ${resolved} resolvidas`, "blue", 1)}
      ${sc("Total Investido", "$"+totalInvested.toFixed(2), "Valor total apostado", "", 2)}
      ${sc("Lucro / Prejuízo", (totalPnl>=0?"+":"")+"$"+totalPnl.toFixed(2), totalPnl>=0?"Lucro geral":"Prejuízo geral", totalPnl>=0?"positive":"negative", 3)}
      ${best ? sc("Maior Ganho", "+$"+best.pnl.toFixed(2), best.market.substring(0,34), "positive", 4) : ""}
      ${worst ? sc("Maior Perda", "-$"+Math.abs(worst.pnl).toFixed(2), worst.market.substring(0,34), "negative", 5) : ""}
    </div>

    <div class="section">
      <div class="section-header"><div class="section-title">📊 Desempenho por Categoria</div></div>
      <div class="cat-grid">
        ${Object.entries(catMap).sort((a,b) => b[1].count - a[1].count).map(([name,d]) => {
          const t = d.wins+d.losses, pct = t>0?(d.wins/t*100):0;
          return `<div class="cat-card"><div class="cat-name"><span>${d.emoji}</span> ${name}</div>
            <div class="cat-row">
              <div class="cat-metric">Apostas<br><span class="cat-metric-val">${d.count}</span></div>
              <div class="cat-metric">Acertos<br><span class="cat-metric-val pnl-pos">${d.wins}</span></div>
              <div class="cat-metric">Erros<br><span class="cat-metric-val pnl-neg">${d.losses}</span></div>
              <div class="cat-metric">Taxa<br><span class="cat-metric-val">${pct.toFixed(0)}%</span></div>
              <div class="cat-metric">P&L<br><span class="cat-metric-val ${d.pnl>=0?'pnl-pos':'pnl-neg'}">${d.pnl>=0?'+':''}$${d.pnl.toFixed(2)}</span></div>
            </div>
            <div class="progress-bar"><div class="progress-fill ${d.pnl>=0?'green':'red'}" style="width:${pct}%"></div></div>
          </div>`;
        }).join("")}
      </div>
    </div>

    <div class="section">
      <div class="section-header">
        <div class="section-title">📋 Histórico de Apostas</div>
        <div class="controls">
          <input type="text" class="search-input" id="searchBox" placeholder="Buscar…" value="${currentSearch}">
          <div class="tabs" id="tabs">
            <button class="tab ${currentFilter==='all'?'active':''}" data-f="all">Todas (${allResults.length})</button>
            <button class="tab ${currentFilter==='ACERTO'?'active':''}" data-f="ACERTO">Acertos (${acertos.length})</button>
            <button class="tab ${currentFilter==='ERRO'?'active':''}" data-f="ERRO">Erros (${erros.length})</button>
            <button class="tab ${currentFilter==='ABERTO'?'active':''}" data-f="ABERTO">Abertos (${abertos.length})</button>
          </div>
        </div>
      </div>
      <div class="table-scroll"><table>
        <thead><tr>
          <th data-s="market" class="${sortKey==='market'?'sorted':''}">Mercado</th>
          <th data-s="side">Aposta</th>
          <th data-s="invested" class="${sortKey==='invested'?'sorted':''}">Investido</th>
          <th data-s="redeemed">Resgatado</th>
          <th data-s="sold">Vendido</th>
          <th data-s="pnl" class="${sortKey==='pnl'?'sorted':''}">P&L</th>
          <th data-s="outcome">Status</th>
        </tr></thead>
        <tbody>${tableRows()}</tbody>
      </table></div>
      <div class="pagination">${pagHTML()}</div>
    </div>

    <div class="footer-note">Polymarket Tracker · Dados via Polymarket Data API · Cache 5 min · <a href="#" onclick="goHome();return false">Trocar wallet</a></div>
  </div>`;

  // Events
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => { currentFilter = t.dataset.f; currentPage = 1; renderDashboard(); }));
  document.getElementById('searchBox')?.addEventListener('input', e => { currentSearch = e.target.value.toLowerCase(); currentPage = 1; renderDashboard(); });
  document.querySelectorAll('th[data-s]').forEach(th => th.addEventListener('click', () => { const k = th.dataset.s; if (sortKey===k) sortDir*=-1; else { sortKey=k; sortDir=-1; } renderDashboard(); }));
}

function sc(label, value, sub, cls, i) {
  return `<div class="stat-card" style="animation-delay:${i*0.06}s"><div class="stat-label">${label}</div><div class="stat-value ${cls}">${value}</div><div class="stat-sub">${sub}</div></div>`;
}

function getFiltered() {
  let d = [...allResults];
  if (currentFilter !== "all") d = d.filter(x => x.outcome === currentFilter);
  if (currentSearch) d = d.filter(x => x.market.toLowerCase().includes(currentSearch) || x.side.toLowerCase().includes(currentSearch));
  d.sort((a,b) => { let va=a[sortKey], vb=b[sortKey]; if (typeof va==="string") return sortDir*va.localeCompare(vb); return sortDir*(va-vb); });
  return d;
}

function tableRows() {
  const f = getFiltered(), tp = Math.ceil(f.length/PER_PAGE)||1;
  if (currentPage>tp) currentPage=tp;
  const s = (currentPage-1)*PER_PAGE;
  return f.slice(s, s+PER_PAGE).map(d => {
    const bc = d.outcome==="ACERTO"?"win":d.outcome==="ERRO"?"loss":"open";
    const bt = d.outcome==="ACERTO"?"✓ Acerto":d.outcome==="ERRO"?"✗ Erro":"◷ Aberto";
    const pc = d.pnl>=0?"pnl-pos":"pnl-neg";
    return `<tr><td class="market-name" title="${d.market}">${d.market}</td><td>${d.side}</td><td class="mono">$${d.invested.toFixed(2)}</td><td class="mono">$${d.redeemed.toFixed(2)}</td><td class="mono">$${d.sold.toFixed(2)}</td><td class="mono ${pc}">${d.pnl>=0?'+':''}$${d.pnl.toFixed(2)}</td><td><span class="badge ${bc}">${bt}</span></td></tr>`;
  }).join("");
}

function pagHTML() {
  const f = getFiltered(), tp = Math.ceil(f.length/PER_PAGE)||1;
  if (tp<=1) return "";
  let h=""; const s=Math.max(1,currentPage-3), e=Math.min(tp,currentPage+3);
  if (s>1) h+=`<button class="page-btn" onclick="gp(1)">1</button>`;
  if (s>2) h+=`<span style="padding:6px;color:var(--text-dim)">…</span>`;
  for (let i=s;i<=e;i++) h+=`<button class="page-btn ${i===currentPage?'active':''}" onclick="gp(${i})">${i}</button>`;
  if (e<tp-1) h+=`<span style="padding:6px;color:var(--text-dim)">…</span>`;
  if (e<tp) h+=`<button class="page-btn" onclick="gp(${tp})">${tp}</button>`;
  return h;
}
window.gp = p => { currentPage=p; renderDashboard(); };

// ─── INIT ───
const initWallet = getWalletFromURL();
if (initWallet && /^0x[a-fA-F0-9]{40}$/.test(initWallet)) { loadWallet(initWallet); }
else { renderLanding(); updateHeader(); }
</script>
</body>
</html>
