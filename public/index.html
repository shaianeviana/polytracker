<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PolyTracker — Your Polymarket Dashboard</title>
<meta name="description" content="Paste your wallet address and see your full Polymarket performance: wins, losses, profits, categories and more.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230052FF'/><text x='16' y='23' text-anchor='middle' fill='white' font-size='20' font-weight='bold'>P</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ── LIGHT MODE (default) ── */
:root {
  --bg: #f7f9fc;
  --bg-card: #ffffff;
  --bg-hover: #f0f4fa;
  --border: #e2e8f0;
  --border-light: #eef2f7;
  --text: #1a1f36;
  --text-secondary: #697386;
  --text-dim: #8892a4;
  --blue: #0052FF;
  --blue-light: #e8f0ff;
  --blue-dark: #003bb3;
  --blue-glow: rgba(0,82,255,0.15);
  --green: #00b341;
  --green-bg: #e6f9ed;
  --red: #e5484d;
  --red-bg: #fef0f0;
  --yellow: #f5a623;
  --yellow-bg: #fef7e8;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 30px rgba(0,0,0,0.08);
  --radius: 12px;
  --header-bg: #ffffff;
}

/* ── DARK MODE (deep blue) ── */
body.dark {
  --bg: #07101f;
  --bg-card: #0d1b33;
  --bg-hover: #112140;
  --border: #1a304d;
  --border-light: #142848;
  --text: #dce8ff;
  --text-secondary: #7090be;
  --text-dim: #3f5a80;
  --blue: #4d8bff;
  --blue-light: #071840;
  --blue-dark: #3a7aff;
  --blue-glow: rgba(77,139,255,0.2);
  --green: #00cc52;
  --green-bg: #021510;
  --red: #ff5c61;
  --red-bg: #1a0509;
  --yellow: #ffaa33;
  --yellow-bg: #180e00;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
  --shadow: 0 1px 4px rgba(0,0,0,0.4);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.4);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.5);
  --header-bg: #0d1b33;
}

* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter',-apple-system,system-ui,sans-serif; background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; transition:background 0.2s, color 0.2s; }
a { color:var(--blue); text-decoration:none; }

/* ── HEADER ── */
.header { background:var(--header-bg); border-bottom:1px solid var(--border); padding:14px 24px; position:sticky; top:0; z-index:100; transition:background 0.2s, border-color 0.2s; }
.header-inner { max-width:1400px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px; }
.logo { display:flex; align-items:center; gap:10px; font-weight:800; font-size:18px; color:var(--text); cursor:pointer; }
.logo-icon { width:30px; height:30px; background:var(--blue); border-radius:7px; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:16px; flex-shrink:0; }
.header-right { display:flex; align-items:center; gap:12px; }
.wallet-pill { font-family:'JetBrains Mono',monospace; font-size:12px; background:var(--bg); padding:6px 14px; border-radius:8px; border:1px solid var(--border); color:var(--text-secondary); }
.status-dot { width:7px; height:7px; border-radius:50%; background:var(--green); display:inline-block; margin-right:3px; animation:pulse 2s infinite; }
.btn { padding:7px 16px; border-radius:8px; font-weight:600; font-size:13px; cursor:pointer; border:none; transition:all 0.15s; }
.btn-primary { background:var(--blue); color:#fff; }
.btn-primary:hover { background:var(--blue-dark); }
.btn-outline { background:transparent; color:var(--text-secondary); border:1px solid var(--border); }
.btn-outline:hover { border-color:var(--blue); color:var(--blue); }

/* ── THEME TOGGLE ── */
.theme-toggle {
  display:flex; align-items:center; gap:6px; padding:6px 12px;
  border-radius:8px; border:1px solid var(--border); background:transparent;
  color:var(--text-secondary); font-size:12px; font-weight:600; cursor:pointer;
  transition:all 0.15s; white-space:nowrap; font-family:inherit;
}
.theme-toggle:hover { border-color:var(--blue); color:var(--blue); }
.theme-toggle svg { width:14px; height:14px; flex-shrink:0; }

/* ── LANDING ── */
.landing { min-height:100vh; display:flex; flex-direction:column; position:relative; overflow:hidden; padding-bottom:48px; }
.landing::before {
  content:''; position:absolute; top:-100px; left:50%; transform:translateX(-50%);
  width:1000px; height:1000px; border-radius:50%;
  background:radial-gradient(circle, var(--blue-glow) 0%, transparent 65%);
  pointer-events:none; z-index:0;
}
.hero {
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:16px 24px 20px; text-align:center; position:relative; z-index:1;
}
.hero-badge {
  display:inline-flex; align-items:center; gap:6px;
  background:var(--blue-light); color:var(--blue); padding:5px 12px;
  border-radius:20px; font-size:12px; font-weight:600; margin-bottom:14px;
  position:relative;
}
.hero h1 { font-size:clamp(40px,6vw,72px); font-weight:900; line-height:1; margin-bottom:6px; position:relative; letter-spacing:-2px; }
.hero h1 span { color:var(--blue); }
.hero-subtitle { font-size:17px; font-weight:500; color:var(--text-secondary); margin-bottom:6px; position:relative; }
.hero p { font-size:15px; color:var(--text-dim); max-width:480px; line-height:1.5; margin-bottom:22px; position:relative; }

.wallet-form { display:flex; gap:8px; width:100%; max-width:580px; position:relative; }
.wallet-input {
  flex:1; padding:16px 20px; border-radius:14px; border:2px solid var(--border);
  font-size:15px; font-family:'JetBrains Mono',monospace; color:var(--text);
  background:var(--bg-card); outline:none; transition:border-color 0.2s, box-shadow 0.2s;
  box-shadow:var(--shadow);
}
.wallet-input:focus { border-color:var(--blue); box-shadow:0 0 0 4px var(--blue-glow); }
.wallet-input::placeholder { color:var(--text-dim); font-family:'Inter',sans-serif; }
.wallet-submit {
  padding:16px 28px; border-radius:14px; background:var(--blue); color:#fff;
  font-size:15px; font-weight:700; border:none; cursor:pointer;
  transition:background 0.15s, transform 0.1s; white-space:nowrap;
  box-shadow:0 2px 8px var(--blue-glow);
}
.wallet-submit:hover { background:var(--blue-dark); transform:translateY(-1px); }
.wallet-submit:active { transform:translateY(0); }
.wallet-error { color:var(--red); font-size:13px; margin-top:10px; font-weight:500; }

.features {
  display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:12px; max-width:750px; width:100%; margin-top:24px; position:relative;
}
.feature-card {
  background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius);
  padding:14px 18px; text-align:left; box-shadow:var(--shadow-sm); transition:background 0.2s, border-color 0.2s;
}
.feature-title { font-weight:700; font-size:13px; margin-bottom:4px; color:var(--text); }
.feature-desc { font-size:12px; color:var(--text-secondary); line-height:1.4; }

/* ── DASHBOARD ── */
.container { max-width:1400px; margin:0 auto; padding:24px 24px 60px; }
.stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(195px,1fr)); gap:12px; margin-bottom:24px; }
.stat-card {
  background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius);
  padding:18px 20px; box-shadow:var(--shadow-sm); transition:box-shadow 0.2s, transform 0.2s, background 0.2s;
  animation:fadeIn 0.4s ease both;
}
.stat-card:hover { box-shadow:var(--shadow-md); transform:translateY(-1px); }
.stat-label { font-size:11px; font-weight:600; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.8px; margin-bottom:6px; }
.stat-value { font-family:'JetBrains Mono',monospace; font-size:26px; font-weight:700; line-height:1.1; }
.stat-sub { font-size:12px; color:var(--text-secondary); margin-top:5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.stat-value.positive { color:var(--green); }
.stat-value.negative { color:var(--red); }
.stat-value.blue { color:var(--blue); }

.section { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-sm); margin-bottom:20px; overflow:hidden; transition:background 0.2s, border-color 0.2s; }
.section-header { padding:16px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; }
.section-title { font-size:15px; font-weight:700; display:flex; align-items:center; gap:8px; }

.cat-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:1px; background:var(--border); }
.cat-card { background:var(--bg-card); padding:18px 20px; transition:background 0.15s; }
.cat-card:hover { background:var(--bg-hover); }
.cat-name { font-weight:700; font-size:14px; margin-bottom:10px; display:flex; align-items:center; gap:7px; }
.cat-row { display:flex; gap:16px; flex-wrap:wrap; }
.cat-metric { font-size:11px; color:var(--text-secondary); }
.cat-metric-val { font-family:'JetBrains Mono',monospace; font-size:15px; font-weight:700; color:var(--text); display:block; margin-top:1px; }
.progress-bar { height:4px; background:var(--border-light); border-radius:2px; overflow:hidden; margin-top:8px; }
.progress-fill { height:100%; border-radius:2px; transition:width 0.8s ease; }
.progress-fill.green { background:var(--green); }
.progress-fill.red { background:var(--red); }

.controls { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.tabs { display:flex; gap:2px; background:var(--bg); border-radius:10px; padding:3px; border:1px solid var(--border); }
.tab { padding:7px 14px; border-radius:8px; cursor:pointer; font-size:12px; font-weight:600; color:var(--text-secondary); background:none; border:none; transition:all 0.15s; white-space:nowrap; }
.tab:hover { color:var(--text); }
.tab.active { background:var(--blue); color:#fff; }
.search-input { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:7px 12px; font-size:13px; color:var(--text); width:220px; font-family:inherit; outline:none; transition:border-color 0.15s; }
.search-input:focus { border-color:var(--blue); }
.search-input::placeholder { color:var(--text-dim); }

.table-scroll { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th { text-align:left; padding:11px 16px; font-size:10px; text-transform:uppercase; letter-spacing:0.8px; color:var(--text-dim); border-bottom:1px solid var(--border); font-weight:600; cursor:pointer; user-select:none; white-space:nowrap; background:var(--bg); position:sticky; top:0; }
th:hover { color:var(--text); }
th.sorted { color:var(--blue); }
td { padding:10px 16px; border-bottom:1px solid var(--border-light); vertical-align:middle; }
tr:last-child td { border-bottom:none; }
tr:hover td { background:var(--bg-hover); }
.market-name { max-width:320px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500; }
.badge { display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600; }
.badge.win { background:var(--green-bg); color:var(--green); }
.badge.loss { background:var(--red-bg); color:var(--red); }
.badge.open { background:var(--yellow-bg); color:var(--yellow); }
.mono { font-family:'JetBrains Mono',monospace; font-weight:500; }
.pnl-pos { color:var(--green); }
.pnl-neg { color:var(--red); }

.pagination { display:flex; gap:4px; justify-content:center; padding:14px; border-top:1px solid var(--border); }
.page-btn { padding:6px 12px; border-radius:6px; border:1px solid var(--border); background:var(--bg-card); color:var(--text-secondary); cursor:pointer; font-size:12px; font-weight:500; transition:all 0.15s; }
.page-btn:hover { border-color:var(--blue); color:var(--blue); }
.page-btn.active { background:var(--blue); color:#fff; border-color:var(--blue); }

.loading-screen { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:80px 20px; gap:14px; }
.spinner { width:36px; height:36px; border:3px solid var(--border); border-top-color:var(--blue); border-radius:50%; animation:spin 0.8s linear infinite; }
.loading-text { font-size:14px; color:var(--text-secondary); }
.error-box { background:var(--red-bg); border:1px solid var(--red-bg); border-radius:var(--radius); padding:24px; margin:40px auto; max-width:500px; text-align:center; color:var(--red); }
.footer-note { text-align:center; padding:20px; color:var(--text-dim); font-size:11px; }

/* ── SITE FOOTER ── */
.site-footer {
  text-align:center; padding:20px 24px 28px; color:var(--text-dim); font-size:12px;
  border-top:1px solid var(--border); position:relative; z-index:1;
}
.site-footer a { color:var(--blue); font-weight:600; }
.site-footer a:hover { color:var(--blue-dark); }

body.dark .logo { color:#ffffff; }

@keyframes spin { to { transform:rotate(360deg); } }
@keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }

@media (max-width:768px) {
  .container { padding:16px; }
  .header { padding:12px 16px; }
  .stat-value { font-size:20px; }
  .stats-grid { grid-template-columns:repeat(2,1fr); gap:8px; }
  .search-input { width:100%; }
  .section-header { flex-direction:column; align-items:stretch; }
  .wallet-form { flex-direction:column; }
  .wallet-submit { width:100%; }
  .wallet-pill { display:none; }
  .hero h1 { letter-spacing:-1px; }
  .features { grid-template-columns:1fr; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="logo" onclick="goHome()"><div class="logo-icon">P</div> PolyTracker</div>
    <div style="display:flex;align-items:center;gap:10px;">
      <div class="header-right" id="headerRight"></div>
      <button class="theme-toggle" id="themeToggle" onclick="toggleDark()">
        <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        Dark
      </button>
    </div>
  </div>
</div>

<div id="app"></div>

<script src="app.js"></script>
</body>
</html>
